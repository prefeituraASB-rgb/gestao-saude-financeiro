<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira - Saúde Municipal</title>
    <!-- Link do CSS do Bootstrap Oficial -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Link para o nosso arquivo de design verde personalizado -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 text-center">
                
                <!-- Card com as sombras e bordas arredondadas do estilo premium -->
                <div class="card-premium p-5">
                    <!-- Logo da Prefeitura de Águas de Santa Bárbara -->
                    <div class="mb-4">
                        <img src="/img/logo-secretaria.png" alt="Secretaria de Saúde" class="img-fluid" style="max-height: 110px;">
                    </div>
                    
                    <h4 class="fw-bold text-dark mb-2">Sistema de Gestão Financeira</h4>
                    <p class="text-muted mb-5 small">Controle de Contas Bancárias da Saúde Municipal</p>
                    
                    <!-- Botão verde elegante para a rota de login -->
                    <div class="d-grid">
                        <a href="/login" class="btn btn-verde-saude btn-lg rounded-3 shadow-sm text-decoration-none">
                            ENTRAR NO SISTEMA
                        </a>
                    </div>
                </div>
                
                <p class="mt-4 text-muted small">&copy; 2026 Secretaria Municipal de Saúde</p>
            </div>
        </div>
    </div>

    <!-- Script do Bootstrap Oficial -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
