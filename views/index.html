<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira - Secretaria de Saúde</title>
    <!-- Link do CSS do Bootstrap para deixar o visual bonito -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Nosso estilo personalizado para ajustes finos -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 text-center">
                <!-- Card Elegante de Boas-vindas -->
                <div class="card shadow-lg border-0 rounded-4 p-5 bg-white">
                    
                    <!-- Espaço para a Logo da Secretaria -->
                    <div class="mb-4">
                        <img src="/img/logo-secretaria.png" alt="Secretaria Municipal de Saúde" class="img-fluid" style="max-height: 120px;">
                    </div>
                    
                    <!-- Título do Sistema -->
                    <h3 class="fw-bold text-secondary mb-2">Sistema de Gestão Financeira</h3>
                    <p class="text-muted mb-5">Controle de Contas Bancárias da Saúde Municipal</p>
                    
                    <!-- Botão Principal de Entrada -->
                    <div class="d-grid">
                        <a href="/login" class="btn btn-primary btn-lg rounded-3 fw-bold py-3 shadow-sm">
                            ENTRAR NO SISTEMA
                        </a>
                    </div>
                    
                </div>
                <!-- Rodapé sutil -->
                <p class="mt-4 text-muted small">&copy; 2026 Secretaria Municipal de Saúde</p>
            </div>
        </div>
    </div>

    <!-- Script do Bootstrap (necessário para componentes interativos) -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
