<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão Financeira</title>
    <!-- Link do CSS do Bootstrap Oficial -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Link para o nosso arquivo de design verde personalizado -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <!-- Card do Formulario de Login -->
                <div class="card-premium p-4">
                    <div class="text-center mb-4">
                        <img src="/img/logo-secretaria.png" alt="Secretaria de Saúde" class="img-fluid" style="max-height: 80px;">
                        <h5 class="fw-bold text-dark mt-3 mb-0">Acesso ao Sistema</h5>
                    </div>

                    <!-- Formulario preparado para enviar dados via POST para o servidor -->
                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label text-muted small fw-bold">USUÁRIO / E-MAIL</label>
                            <input type="text" class="form-control form-control-lg text-dark" id="username" name="username" placeholder="Digite seu usuário" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label text-muted small fw-bold">SENHA</label>
                            <input type="password" class="form-control form-control-lg text-dark" id="password" name="password" placeholder="Digite sua senha" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-verde-saude btn-lg rounded-3 py-2 shadow-sm">
                                ACESSAR
                            </button>
                            <a href="/" class="btn btn-link btn-sm text-decoration-none text-muted mt-2">
                                Voltar para o início
                            </a>
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Script do Bootstrap Oficial -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
